[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Mathias Vanden Auweele <mathias@matdata.eu>"]
license = "Apache-2.0"
homepage = "https://github.com/Matdata-eu/ontology-explorer"
repository = "https://github.com/Matdata-eu/ontology-explorer"

[workspace.dependencies]
ontology-explorer-core = { path = "crates/core", version = "0.1.0" }
anyhow = "1"
oxrdf = "0.3"
oxttl = "0.2"
oxrdfxml = "0.2"
oxjsonld = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

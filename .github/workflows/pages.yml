name: Pages

# Publishes the viewer on GitHub Pages with the examples in
# examples/catalog.json: the small library ontology in this repository, the ERA
# vocabulary (fetched from the European Union Agency for Railways' GitLab) and
# well-known vocabularies fetched from their publishers at build time.

on:
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: "17 4 * * 1" # weekly, to pick up vocabulary updates
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-web
      - name: Build the CLI
        run: cargo build --release --locked -p ontology-explorer
      - name: Build the example bundles
        run: |
          set -euo pipefail
          scripts/fetch-era.sh main
          # Examples whose files cannot be fetched are left out with a warning.
          scripts/build-examples.sh ./target/release/ontology-explorer web/dist
          cp examples/era/README.md web/dist/examples/ERA-README.md
          cp THIRD_PARTY_NOTICES.md web/dist/
          touch web/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
